function createFireflies(scene, count) {
  const positions = new Float32Array(count * 3);
  const seed = new Float32Array(count);
  const r = rng(3311);
  const base = [];
  for (let i = 0; i < count; i++) {
    let x, z, y, tries = 0;
    do {
      const zz = -80 + r() * 190;
      const side = r() < 0.5 ? -1 : 1;
      x = riverX(zz) + side * (14 + r() * 46);
      z = zz;
      y = groundAt(x, z) + 1.0 + r() * 3.4;
      tries++;
    } while (y < 1.8 && tries < 18);
    base.push({ x, y, z, ph: r() * TAU, sp: 0.25 + r() * 0.5, amp: 1.2 + r() * 3.2 });
    positions[i * 3] = x; positions[i * 3 + 1] = y; positions[i * 3 + 2] = z;
    seed[i] = r();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uOpacity: { value: 1 },
      uColor: { value: new THREE.Color(0xffd98a) },
      uScale: { value: 1 },
    },
    vertexShader: `
      attribute float aSeed;
      uniform float uTime, uScale;
      varying float vA;
      void main(){
        vec3 p = position;
        p.y += sin(uTime * 0.9 + aSeed * 12.0) * 0.8;
        p.x += sin(uTime * 0.5 + aSeed * 30.0) * 1.4;
        p.z += cos(uTime * 0.42 + aSeed * 21.0) * 1.4;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        vA = 0.35 + 0.65 * pow(0.5 + 0.5 * sin(uTime * 2.2 + aSeed * 44.0), 2.0);
        gl_PointSize = (9.0 + aSeed * 9.0) * uScale / max(-mv.z, 1.0) * 3.0;
      }`,
    fragmentShader: `
      uniform vec3 uColor; uniform float uOpacity;
      varying float vA;
      void main(){
        vec2 c = gl_PointCoord - 0.5;
        float d = length(c);
        float a = smoothstep(0.5, 0.02, d);
        a *= a;
        gl_FragColor = vec4(uColor * a * 0.85 * vA, a * vA * uOpacity);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  scene.add(pts);
  return { mesh: pts, mat, base };
}

function createRain(scene, count) {
  const pos = new Float32Array(count * 6);
  const seed = new Float32Array(count * 2);
  const r = rng(8821);
  for (let i = 0; i < count; i++) {
    // 环状分布：相机 24 单位内不放雨丝，否则近线段在屏幕上会拉成划痕
    const ang = r() * TAU;
    const rad = 24 + Math.sqrt(r()) * 126;
    const x = Math.cos(ang) * rad;
    const y = r() * 80;
    const z = Math.sin(ang) * rad;
    // 雨丝要短：原来 1.6~4.2 单位的线段在近处会横跨小半个屏幕，像划痕
    const len = 0.45 + r() * 1.15;
    pos[i * 6] = x; pos[i * 6 + 1] = y; pos[i * 6 + 2] = z;
    pos[i * 6 + 3] = x + 0.05; pos[i * 6 + 4] = y - len; pos[i * 6 + 5] = z;
    seed[i * 2] = r(); seed[i * 2 + 1] = r();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uOpacity: { value: 0 }, uCam: { value: new THREE.Vector3() } },
    vertexShader: `
      attribute float aSeed;
      uniform float uTime; uniform vec3 uCam;
      varying float vA;
      void main(){
        vec3 p = position;
        float sp = 30.0 + aSeed * 26.0;
        p.y = mod(p.y - uTime * sp, 80.0) - 16.0;
        p.x += sin(uTime * 0.4 + aSeed * 9.0) * 0.55;
        vec3 wp = p + uCam;
        vec4 mv = viewMatrix * vec4(wp, 1.0);
        gl_Position = projectionMatrix * mv;
        vA = 0.3 + aSeed * 0.55;
      }`,
    fragmentShader: `
      uniform float uOpacity; varying float vA;
      void main(){ gl_FragColor = vec4(0.72, 0.79, 0.88, uOpacity * vA); }`,
    transparent: true, depthWrite: false,
  });
  const lines = new THREE.LineSegments(geo, mat);
  lines.frustumCulled = false;
  lines.visible = false;
  scene.add(lines);
  return { mesh: lines, mat };
}

function createBirds(scene, count) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x2b3038, roughness: 0.9, metalness: 0 });
  const birds = [];
  const r = rng(1212);
  for (let i = 0; i < count; i++) {
    const b = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.45, 0.55), mat);
    const w1 = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.12, 1.6), mat);
    const w2 = w1.clone();
    w1.position.set(0.2, 0.1, 0.95);
    w2.position.set(0.2, 0.1, -0.95);
    b.add(body, w1, w2);
    b.userData = { w1, w2 };
    g.add(b);
    birds.push({
      b, rad: 110 + r() * 120, sp: 0.05 + r() * 0.045,
      ph: r() * TAU, y: 78 + r() * 60, flap: 2.6 + r() * 1.8, sc: 0.8 + r() * 0.7,
    });
  }
  scene.add(g);
  return {
    group: g,
    update(t) {
      for (const o of birds) {
        const a = o.ph + t * o.sp;
        o.b.position.set(Math.cos(a) * o.rad, o.y + Math.sin(t * 0.4 + o.ph) * 4, Math.sin(a) * o.rad - 60);
        o.b.rotation.y = -a + Math.PI / 2;
        o.b.scale.setScalar(o.sc);
        const f = Math.sin(t * o.flap + o.ph) * 0.55;
        o.b.userData.w1.rotation.x = f;
        o.b.userData.w2.rotation.x = -f;
      }
    }
  };
}

function createKoi(scene, count) {
  const g = new THREE.Group();
  const arr = [];
  const r = rng(707);
  const palette = [0xe8622e, 0xf0f0ee, 0xd9a03a, 0xe8622e, 0xf4f2ee];
  for (let i = 0; i < count; i++) {
    const mat = new THREE.MeshStandardMaterial({ color: palette[i % palette.length], roughness: 0.6, metalness: 0 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 0.9), mat);
    const tail = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.45, 0.6), mat);
    tail.position.x = -1.5;
    const grp = new THREE.Group();
    grp.add(body, tail);
    g.add(grp);
    arr.push({ grp, tail, z: -40 + r() * 160, off: (r() - 0.5) * 12, sp: 2.5 + r() * 2.5, ph: r() * TAU, scale: 0.8 + r() * 0.5 });
  }
  scene.add(g);
  return {
    update(t) {
      for (const k of arr) {
        const z = k.z + Math.sin(t * 0.2 + k.ph) * 8;
        const x = riverX(z) + k.off + Math.sin(t * 0.5 + k.ph) * 2.5;
        k.grp.position.set(x, -0.55, z);
        k.grp.rotation.y = Math.sin(t * 0.6 + k.ph) * 0.6;
        k.tail.rotation.y = Math.sin(t * 5 + k.ph) * 0.5;
        k.grp.scale.setScalar(k.scale);
      }
    }
  };
}

/* ---------------- 场景装配 ---------------- */
const PETAL_SOURCES = [];

const CAM_CLEAR = [[60, 158], [-11, 92], [-27, 44], [-124, 58]];
function nearCam(x, z, rad) {
  for (let i = 0; i < CAM_CLEAR.length; i++) {
    const dx = x - CAM_CLEAR[i][0], dz = z - CAM_CLEAR[i][1];
    if (dx * dx + dz * dz < rad * rad) return true;
  }
  return false;
}

function blockedByPad(x, z, s) {
  for (let i = 0; i < PADS.length; i++) {
    const p = PADS[i];
    const dx = x - p.x, dz = z - p.z;
    if (dx * dx + dz * dz < (p.r * (s || 1)) * (p.r * (s || 1))) return true;
  }
  return false;
}

function buildWorld(quality) {
  const dens = quality === 'lite' ? 0.52 : 1;
  const B = new Builder();
  const E = new Builder();
  const r = rng(20261026);

  // --- 地形 ---
  const info = buildTerrain(B, quality === 'lite' ? CFG.cellsLite : CFG.cellsHigh);

  // --- 远山 ---
  buildFarRanges(B);

  // --- 主角樱花树 ---
  const hero = { x: 86, z: 104, scale: 1.3, seed: 11, thick: 4.2, trunkH: 13, crown: 7.2, branches: 8, branchSteps: 7 };
  cherryTree(B, hero.x, hero.z, hero);
  PETAL_SOURCES.push({ x: hero.x, z: hero.z, y: groundAt(hero.x, hero.z), r: 20, h: 26 });

  const cherries = [
    { x: -44, z: 104, scale: 1.0, seed: 22, thick: 2.8, trunkH: 10, crown: 7.2 },
    { x: 48, z: 74, scale: 0.9, seed: 33, thick: 2.5, trunkH: 9.5, crown: 6.8 },
    { x: -62, z: 46, scale: 0.92, seed: 44, thick: 2.6, trunkH: 9.5, crown: 7.2 },
    { x: 104, z: 96, scale: 0.85, seed: 55, thick: 2.3, trunkH: 8.5, crown: 6.2 },
    { x: 22, z: 116, scale: 0.7, seed: 66, thick: 2.1, trunkH: 8, crown: 5.6 },
  ];
  for (const c of cherries) {
    cherryTree(B, c.x, c.z, {
      scale: c.scale, seed: c.seed, thick: c.thick, trunkH: c.trunkH, crown: c.crown,
      branches: 5, branchSteps: 6,
    });
    PETAL_SOURCES.push({ x: c.x, z: c.z, y: groundAt(c.x, c.z), r: 12 * c.scale + 4, h: 16 * c.scale });
  }

  // --- 散布樱花树 ---
  const placed = [];
  const canPlace = (x, z, md) => {
    for (let i = 0; i < placed.length; i++) {
      const dx = placed[i].x - x, dz = placed[i].z - z;
      if (dx * dx + dz * dz < md * md) return false;
    }
    return true;
  };
  for (const c of cherries) placed.push({ x: c.x, z: c.z });
  placed.push({ x: hero.x, z: hero.z });

  const nCherry = Math.round(34 * dens);
  for (let i = 0; i < nCherry * 3 && placed.length < nCherry + 8; i++) {
    const z = -205 + r() * 400;
    const side = r() < 0.5 ? -1 : 1;
    const dist = 24 + Math.pow(r(), 0.75) * 95;
    const x = riverX(z) + side * dist;
    if (Math.abs(x) > 215) continue;
    const h = groundAt(x, z);
    if (h < 1.6 || h > 58) continue;
    if (pathDist(x, z) < 7) continue;
    if (blockedByPad(x, z, 1.3)) continue;
    if (nearCam(x, z, 30)) continue;
    if (!canPlace(x, z, 13)) continue;
    const sc = 0.5 + r() * 0.5;
    cherryTree(B, x, z, {
      scale: sc, seed: 300 + i, thick: 2.0 + r() * 0.6, trunkH: 8 + r() * 2.5,
      crown: 5.0 + r() * 2.0, branches: 4, branchSteps: 5, tint: 'small',
    });
    placed.push({ x, z });
    if (sc > 0.62) PETAL_SOURCES.push({ x, z, y: h, r: 6 + sc * 6, h: 11 * sc });
  }

  // --- 针叶林 ---
  const nPine = Math.round(250 * dens);
  for (let i = 0; i < nPine * 2; i++) {
    const z = -232 + r() * 464;
    const side = r() < 0.5 ? -1 : 1;
    const dist = 38 + Math.pow(r(), 0.6) * 155;
    const x = riverX(z) + side * dist;
    if (Math.abs(x) > 226 || Math.abs(z) > 228) continue;
    const h = groundAt(x, z);
    if (h < 5 || h > 92) continue;
    if (pathDist(x, z) < 6) continue;
    if (blockedByPad(x, z, 1.15)) continue;
    if (nearCam(x, z, 30)) continue;
    if (!canPlace(x, z, 6.5)) continue;
    conifer(B, x, z, 0.65 + r() * 0.95, r, h);
    placed.push({ x, z });
  }

  // --- 机位前景陈设：给四个镜头前各补几块石与草丛，避免近景空荡 ---
  for (let c = 0; c < CAM_CLEAR.length; c++) {
    const cx = CAM_CLEAR[c][0], cz = CAM_CLEAR[c][1];
    for (let i = 0; i < 9; i++) {
      const a = r() * TAU;
      const d = 9 + r() * 15;
      const x = cx + Math.cos(a) * d, z = cz + Math.sin(a) * d;
      const h = groundAt(x, z);
      if (h < 0.6) continue;
      if (r() < 0.45) rockCluster(B, x, z, 0.45 + r() * 0.75, r, h - 0.2);
      else grassTuft(B, x, z, r, h, 0.95 + r() * 0.2);
    }
  }

  // --- 岸边石块 ---
  for (let z = -232; z < 234; z += 6.2) {
    for (let s = -1; s <= 1; s += 2) {
      if (r() < 0.5) continue;
      const d = 14.5 + r() * 6.5;
      const x = riverX(z) + s * d;
      const zz = z + (r() - 0.5) * 4;
      const h = groundAt(x, zz);
      if (h < 0.55) continue;   // 水下不放，否则会变成浮在水面的方块
      rockCluster(B, x, zz, 0.38 + r() * 0.55, r, h - 0.28);
    }
  }
  // 山坡散石
  for (let i = 0; i < 130 * dens; i++) {
    const z = -220 + r() * 440;
    const x = riverX(z) + (r() - 0.5) * 2 * (30 + r() * 150);
    if (Math.abs(x) > 230) continue;
    const h = groundAt(x, z);
    if (h < 2 || h > 100) continue;
    rockCluster(B, x, z, 0.5 + r() * 1.1, r, h);
  }

  // --- 草丛 ---
  for (let i = 0; i < Math.round(2600 * dens); i++) {
    const z = -200 + r() * 420;
    const x = riverX(z) + (r() - 0.5) * 2 * (22 + Math.pow(r(), 0.85) * 110);
    if (Math.abs(x) > 220) continue;
    const h = groundAt(x, z);
    if (h < 1.1 || h > 34) continue;
    if (pathDist(x, z) < 3.0) continue;
    grassTuft(B, x, z, r, h, 0.9 + r() * 0.25);
  }

  // --- 地面落花 ---
  groundPetals(B, hero.x, hero.z, 17, Math.round(190 * dens), r);
  for (let i = 0; i < Math.round(60 * dens); i++) {
    const z = 40 + r() * 150;
    const x = riverX(z) + (r() - 0.5) * 2 * 70;
    const h = groundAt(x, z);
    if (h < 1.2) continue;
    groundPetals(B, x, z, 2.4, 5, r);
  }

  // --- 建筑 ---
  buildTeahouse(B, E, 34, 2);
  buildHouse(B, E, 58, -16, { rot: 0.34, w: 15, d: 11, h: 6.8, seed: 12, lit: true, windows: 2 });
  buildHouse(B, E, 41, -45, { rot: -0.55, w: 11.5, d: 9.5, h: 5.4, seed: 24, lit: false, windows: 2, tiers: 3 });
  buildHouse(B, E, 75, -53, { rot: 0.92, w: 13.5, d: 10.5, h: 6.2, seed: 36, lit: true, windows: 2, plaster: COL.plasterWarm });
  buildHouse(B, E, 47, 13, { rot: 0.52, w: 6.6, d: 5.6, h: 3.2, seed: 48, lit: false, windows: 1, tiers: 3 });
  buildHouse(B, E, 66, -34, { rot: 0.18, w: 12.5, d: 9.5, h: 5.8, seed: 60, lit: true, windows: 2, tiers: 4 });

  buildShrine(B, E, -72, -58);
  buildPagoda(B, E, -104, -146);
  buildTorii(B, -28, 5, 1.0, 0.405);
  buildTorii(B, -63, -50, 0.82, 0.835);

  buildBridge(B, E);

  // 石灯笼
  const lanternSpots = [
    [27, 11, 1.0, 0.4], [45, 24, 0.85, -0.3], [-21, 24, 0.85, 0.2],
    [-36, -12, 0.95, 0.7], [-52, -34, 0.8, -0.5], [-66, -53, 1.05, 0.3],
  ];
  for (const L of lanternSpots) buildLantern(B, E, L[0], L[1], L[2], L[3]);

  // 竹篱
  buildFence(B, [[52, 6], [63, -4], [70, -22]], 2.1);
  buildFence(B, [[30, -22], [38, -30], [44, -40]], 2.0);
  buildFence(B, [[-24, 34], [-33, 26], [-40, 14]], 1.9);

  // 参道踏石
  pathStones(B, PATHS[1], r);
  pathStones(B, PATHS[0], r);

  // --- 网格 ---
  const worldMat = new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.93, metalness: 0.02,
  });
  const world = new THREE.Mesh(B.toGeometry(), worldMat);
  world.castShadow = true;
  world.receiveShadow = true;
  world.matrixAutoUpdate = false;
  scene.add(world);

  const emat = new THREE.MeshBasicMaterial({ vertexColors: true, fog: true });
  const emissive = new THREE.Mesh(E.toGeometry(), emat);
  emissive.matrixAutoUpdate = false;
  scene.add(emissive);

  return { terrain: info, count: B.p.length / 3, world, emissive };
}

};

let liveM = null;
let targetM = null;

function buildLive() {
  const d = MOOD_DEFS[state.mood];
  liveM = {
    skyTop: new THREE.Color(d.sky.top), skyMid: new THREE.Color(d.sky.mid),
    skyHorizon: new THREE.Color(d.sky.horizon), skyGlow: new THREE.Color(d.sky.glow),
    stars: d.sky.stars,
    fog: new THREE.Color(d.fog.color), fogDensity: d.fog.density,
    sunColor: new THREE.Color(d.sun.color), sunI: d.sun.intensity,
    sunDir: new THREE.Vector3().fromArray(d.sun.dir).normalize(),
    hemiSky: new THREE.Color(d.hemi.sky), hemiGround: new THREE.Color(d.hemi.ground), hemiI: d.hemi.intensity,
    exposure: d.exposure, bloom: d.bloom, lantern: d.lantern, sat: d.sat, rain: d.rain,
    wShallow: new THREE.Color(d.water.shallow), wDeep: new THREE.Color(d.water.deep),
    wRefl: d.water.refl, wChop: d.water.chop,
  };
  targetM = cloneMood(liveM);
}

function cloneMood(m) {
  return {
    skyTop: m.skyTop.clone(), skyMid: m.skyMid.clone(), skyHorizon: m.skyHorizon.clone(),
    skyGlow: m.skyGlow.clone(), stars: m.stars,
    fog: m.fog.clone(), fogDensity: m.fogDensity,
    sunColor: m.sunColor.clone(), sunI: m.sunI, sunDir: m.sunDir.clone(),
    hemiSky: m.hemiSky.clone(), hemiGround: m.hemiGround.clone(), hemiI: m.hemiI,
    exposure: m.exposure, bloom: m.bloom, lantern: m.lantern, sat: m.sat, rain: m.rain,
    wShallow: m.wShallow.clone(), wDeep: m.wDeep.clone(), wRefl: m.wRefl, wChop: m.wChop,
  };
}

function setMood(name) {
  if (!MOOD_DEFS[name]) return;
  state.mood = name;
  const d = MOOD_DEFS[name];
  targetM.skyTop.set(d.sky.top); targetM.skyMid.set(d.sky.mid);
  targetM.skyHorizon.set(d.sky.horizon); targetM.skyGlow.set(d.sky.glow);
  targetM.stars = d.sky.stars;
  targetM.fog.set(d.fog.color); targetM.fogDensity = d.fog.density;
  targetM.sunColor.set(d.sun.color); targetM.sunI = d.sun.intensity;
  targetM.sunDir.fromArray(d.sun.dir).normalize();
  targetM.hemiSky.set(d.hemi.sky); targetM.hemiGround.set(d.hemi.ground); targetM.hemiI = d.hemi.intensity;
  targetM.exposure = d.exposure; targetM.bloom = d.bloom; targetM.lantern = d.lantern;
  targetM.sat = d.sat; targetM.rain = d.rain;
  targetM.wShallow.set(d.water.shallow); targetM.wDeep.set(d.water.deep);
  targetM.wRefl = d.water.refl; targetM.wChop = d.water.chop;

  document.querySelectorAll('#moodPills .pill').forEach((b) => {
    b.classList.toggle('on', b.dataset.mood === name);
  });
  const sub = document.querySelector('.titleBlock .sub');
  if (sub) sub.textContent = 'Sakura Valley · ' + ({ dusk: '暮色', dawn: '清晨', rain: '雨中' })[name];
  if (audio.on) audio.setRain(d.rain);
}

function updateMood(dt) {
  const k = 1 - Math.exp(-2.1 * dt);
  liveM.skyTop.lerp(targetM.skyTop, k);
  liveM.skyMid.lerp(targetM.skyMid, k);
  liveM.skyHorizon.lerp(targetM.skyHorizon, k);
  liveM.skyGlow.lerp(targetM.skyGlow, k);
  liveM.stars = lerp(liveM.stars, targetM.stars, k);
  liveM.fog.lerp(targetM.fog, k);
  liveM.fogDensity = lerp(liveM.fogDensity, targetM.fogDensity, k);
  liveM.sunColor.lerp(targetM.sunColor, k);
  liveM.sunI = lerp(liveM.sunI, targetM.sunI, k);
  liveM.sunDir.lerp(targetM.sunDir, k).normalize();
  liveM.hemiSky.lerp(targetM.hemiSky, k);
  liveM.hemiGround.lerp(targetM.hemiGround, k);
  liveM.hemiI = lerp(liveM.hemiI, targetM.hemiI, k);
  liveM.exposure = lerp(liveM.exposure, targetM.exposure, k);
  liveM.bloom = lerp(liveM.bloom, targetM.bloom, k);
  liveM.lantern = lerp(liveM.lantern, targetM.lantern, k);
  liveM.sat = lerp(liveM.sat, targetM.sat, k);
  liveM.rain = lerp(liveM.rain, targetM.rain, k);
  liveM.wShallow.lerp(targetM.wShallow, k);
  liveM.wDeep.lerp(targetM.wDeep, k);
  liveM.wRefl = lerp(liveM.wRefl, targetM.wRefl, k);
  liveM.wChop = lerp(liveM.wChop, targetM.wChop, k);
}

function applyLive() {
  const u = sky.material.uniforms;
  u.cTop.value.copy(liveM.skyTop);
  u.cMid.value.copy(liveM.skyMid);
  u.cHorizon.value.copy(liveM.skyHorizon);
  u.cGlow.value.copy(liveM.skyGlow);
  u.uStars.value = liveM.stars;
  u.uSunDir.value.copy(liveM.sunDir);

  scene.fog.color.copy(liveM.fog);
  scene.fog.density = liveM.fogDensity;

  sunLight.color.copy(liveM.sunColor);
  sunLight.intensity = liveM.sunI;
  sunLight.position.copy(liveM.sunDir).multiplyScalar(240);
  sunLight.position.x += 10;

  hemiLight.color.copy(liveM.hemiSky);
  hemiLight.groundColor.copy(liveM.hemiGround);
  hemiLight.intensity = liveM.hemiI;

  const wu = water.uniforms;
  wu.uSunDir.value.copy(liveM.sunDir);
  // 高光色必须跟着氛围走，否则一直用默认的暖米色，水面会浮出一片片土黄
  wu.uSunColor.value.copy(liveM.sunColor);
  wu.uShallow.value.copy(liveM.wShallow);
  wu.uDeep.value.copy(liveM.wDeep);
  wu.uFogColor.value.copy(liveM.fog);
  wu.uFogDensity.value = liveM.fogDensity;
  wu.uRefl.value = liveM.wRefl;
  wu.uChop.value = liveM.wChop;
  wu.uRain.value = liveM.rain;
  if (DBG.get('norefl')) wu.uRefl.value = 0;
  if (DBG.get('nofoam')) wu.uChop.value = 0;
  if (water) water.off = !!DBG.get('nowater');
  if (DBG.get('wd')) water.uniforms.uDbg.value = Number(DBG.get('wd'));
  if (DBG.get('showdepth')) {
    wu.uRefl.value = 0; wu.uSunColor.value.setRGB(0, 0, 0);
  }

  post.setExposure(liveM.exposure);
  post.setBloom(liveM.bloom);
  post.setSat(liveM.sat);

  if (worldMeshes && worldMeshes.emissive) {
    worldMeshes.emissive.material.color.setScalar(liveM.lantern);
  }
  for (const L of lanternLights) L.intensity = L.userData.base * liveM.lantern;

  const rainOn = liveM.rain > 0.02;
  if (rain.mesh.visible !== rainOn) rain.mesh.visible = rainOn;
  rain.mat.uniforms.uOpacity.value = Math.max(0, (liveM.rain - 0.05)) * 0.46;
  if (fireflies) fireflies.mat.uniforms.uOpacity.value = clamp(1.15 - liveM.rain * 1.6, 0, 1) * (state.mood === 'dawn' ? 0.25 : 1);
  if (floaters) floaters.mesh.visible = true;
}

/* ---------------- 后处理 ---------------- */
function createPost(renderer) {
  const size = new THREE.Vector2();
  renderer.getDrawingBufferSize(size);
  let W = Math.max(2, size.x | 0), H = Math.max(2, size.y | 0);

  const rtOpts = {
    type: THREE.HalfFloatType, minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter, depthBuffer: true, stencilBuffer: false,
  };
  const rtScene = new THREE.WebGLRenderTarget(W, H, Object.assign({}, rtOpts, { samples: 4 }));
  const rtA = new THREE.WebGLRenderTarget(Math.max(2, W >> 1), Math.max(2, H >> 1), Object.assign({}, rtOpts, { depthBuffer: false }));
  const rtB = new THREE.WebGLRenderTarget(Math.max(2, W >> 1), Math.max(2, H >> 1), Object.assign({}, rtOpts, { depthBuffer: false }));

  const qScene = new THREE.Scene();
  const qCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial());
  quad.frustumCulled = false;
  qScene.add(quad);

  const VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

  const brightMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null }, uThreshold: { value: 0.72 }, uKnee: { value: 0.5 } },
    vertexShader: VS,
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform float uThreshold, uKnee;
      varying vec2 vUv;
      void main(){
        vec3 c = texture2D(tDiffuse, vUv).rgb;
        float l = max(c.r, max(c.g, c.b));
        float k = smoothstep(uThreshold, uThreshold + uKnee, l);
        gl_FragColor = vec4(c * k, 1.0);
      }`,
    depthTest: false, depthWrite: false,
  });

  const blurMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2(1, 0) }, uTexel: { value: new THREE.Vector2(1 / W, 1 / H) } },
    vertexShader: VS,
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform vec2 uDir, uTexel;
      varying vec2 vUv;
      void main(){
        vec2 o = uDir * uTexel;
        vec3 s = texture2D(tDiffuse, vUv).rgb * 0.227027;
        s += (texture2D(tDiffuse, vUv + o * 1.384615).rgb + texture2D(tDiffuse, vUv - o * 1.384615).rgb) * 0.316216;
        s += (texture2D(tDiffuse, vUv + o * 3.230769).rgb + texture2D(tDiffuse, vUv - o * 3.230769).rgb) * 0.070270;
        gl_FragColor = vec4(s, 1.0);
      }`,
    depthTest: false, depthWrite: false,
  });

  const compMat = new THREE.ShaderMaterial({
    uniforms: {
      tScene: { value: null }, tBloom: { value: null },
      uBloom: { value: 0.6 }, uExposure: { value: 1.1 }, uSat: { value: 1.0 },
      uRes: { value: new THREE.Vector2(W, H) }, uTime: { value: 0 },
    },
    vertexShader: VS,
    fragmentShader: `
      uniform sampler2D tScene, tBloom;
      uniform float uBloom, uExposure, uSat, uTime;
      uniform vec2 uRes;
      varying vec2 vUv;

      vec3 aces(vec3 x){
        const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
        return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
      }
      vec3 toSRGB(vec3 c){
        return mix(1.055 * pow(max(c, 0.0), vec3(0.41666)) - 0.055, c * 12.92, step(c, vec3(0.0031308)));
      }
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

      void main(){
        vec3 c = texture2D(tScene, vUv).rgb;
        vec3 b = texture2D(tBloom, vUv).rgb;
        c *= uExposure;
        c += b * uBloom;
        c = aces(c);

        float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
        c = mix(vec3(l), c, uSat);
        // 暗部略冷、亮部微暖
        c += vec3(-0.010, 0.001, 0.018) * (1.0 - smoothstep(0.0, 0.42, l));
        c += vec3(0.016, 0.006, -0.010) * smoothstep(0.6, 1.0, l);

        vec2 p = vUv - 0.5;
        float v = 1.0 - dot(p, p) * 0.78;
        c *= clamp(v, 0.0, 1.0);

        c = toSRGB(clamp(c, 0.0, 1.0));
        c += (hash(vUv * uRes + fract(uTime)) - 0.5) / 255.0;
        gl_FragColor = vec4(c, 1.0);
      }`,
    depthTest: false, depthWrite: false,
  });

  function blit(mat, target) {
    quad.material = mat;
    renderer.setRenderTarget(target);
    renderer.clear();
    renderer.render(qScene, qCam);
  }

  function render(t) {
    compMat.uniforms.uTime.value = t;
    renderer.setRenderTarget(rtScene);
    renderer.clear();
    renderer.render(scene, camera);

    brightMat.uniforms.tDiffuse.value = rtScene.texture;
    blit(brightMat, rtA);

    const hw = rtA.width, hh = rtA.height;
    for (let i = 0; i < 2; i++) {
      blurMat.uniforms.uTexel.value.set(1 / hw, 1 / hh);
      blurMat.uniforms.tDiffuse.value = rtA.texture;
      blurMat.uniforms.uDir.value.set(1 + i * 1.6, 0);
      blit(blurMat, rtB);
      blurMat.uniforms.tDiffuse.value = rtB.texture;
      blurMat.uniforms.uDir.value.set(0, 1 + i * 1.6);
      blit(blurMat, rtA);
    }

    compMat.uniforms.tScene.value = rtScene.texture;
    compMat.uniforms.tBloom.value = rtA.texture;
    blit(compMat, null);
  }

  function resize() {
    const s = new THREE.Vector2();
    renderer.getDrawingBufferSize(s);
    const nw = Math.max(2, s.x | 0), nh = Math.max(2, s.y | 0);
    rtScene.setSize(nw, nh);
    rtA.setSize(Math.max(2, nw >> 1), Math.max(2, nh >> 1));
    rtB.setSize(Math.max(2, nw >> 1), Math.max(2, nh >> 1));
    compMat.uniforms.uRes.value.set(nw, nh);
  }

  return {
    render, resize,
    setExposure(v) { compMat.uniforms.uExposure.value = v; },
    setBloom(v) { compMat.uniforms.uBloom.value = v; },
    setSat(v) { compMat.uniforms.uSat.value = v; },
    rtScene,
  };
}

/* ---------------- 镜头 ---------------- */
let rig = null;
let presets = null;

function camPresets() {
  const g = groundAt;
  return [
    { pos: [60, 40, 158], target: [6, 9, -26], fov: 46 },
    { pos: [-11, Math.max(3.2, g(-11, 92) + 3.4), 92], target: [16, 6.2, 24], fov: 48 },
    { pos: [-27, g(-27, 44) + 5.6, 44], target: [-66, g(-66, -48) + 10.5, -48], fov: 47 },
    { pos: [-124, 88, 58], target: [10, 4, 8], fov: 43 },
  ];
}

function initRig() {
  presets = camPresets();
  // 调试：?cam=x,y,z&look=x,y,z 覆盖默认机位
  try {
    const q = new URLSearchParams(location.search);
    if (q.get('cam') && q.get('look')) {
      const c = q.get('cam').split(',').map(Number);
      const l = q.get('look').split(',').map(Number);
      presets[0] = { pos: c, target: l, fov: Number(q.get('fov') || 46) };
    }
  } catch (e) { /* ignore */ }
  rig = {
    cur: { target: new THREE.Vector3(), radius: 120, theta: 0, phi: 0.9, fov: 46 },
    tgt: { target: new THREE.Vector3(), radius: 120, theta: 0, phi: 0.9, fov: 46 },
  };
  goToPreset(0, true);
  applyCamera();
}

function goToPreset(i, instant) {
  const p = presets[i];
  if (!p) return;
  state.camIndex = i;
  const target = new THREE.Vector3(p.target[0], p.target[1], p.target[2]);
  const pos = new THREE.Vector3(p.pos[0], p.pos[1], p.pos[2]);
  const d = new THREE.Vector3().subVectors(pos, target);
  const radius = d.length();
  rig.tgt.radius = radius;
  rig.tgt.phi = Math.acos(clamp(d.y / radius, -1, 1));
  rig.tgt.theta = Math.atan2(d.z, d.x);
  rig.tgt.target.copy(target);
  rig.tgt.fov = p.fov;
  if (instant) {
    rig.cur.radius = rig.tgt.radius;
    rig.cur.phi = rig.tgt.phi;
    rig.cur.theta = rig.tgt.theta;
    rig.cur.fov = rig.tgt.fov;
    rig.cur.target.copy(rig.tgt.target);
  }
  document.querySelectorAll('#camPills .pill').forEach((b) => {
    b.classList.toggle('on', +b.dataset.cam === i);
  });
}

function applyCamera() {
  const c = rig.cur;
  const sp = Math.sin(c.phi), cp = Math.cos(c.phi);
  camera.position.set(
    c.target.x + c.radius * sp * Math.cos(c.theta),
    c.target.y + c.radius * cp,
    c.target.z + c.radius * sp * Math.sin(c.theta)
  );
  const gy = groundAt(camera.position.x, camera.position.z);
  if (camera.position.y < gy + 1.6) camera.position.y = gy + 1.6;
  camera.lookAt(c.target);
  // 竖屏时放宽垂直视角，保持横向构图不被裁掉
  const portrait = camera.aspect < 1 ? 1 + (1 - camera.aspect) * 0.44 : 1;
  const wantFov = Math.min(80, c.fov * portrait);
  if (Math.abs(camera.fov - wantFov) > 0.02) {
    camera.fov = wantFov;
    camera.updateProjectionMatrix();
  }
}

function updateRig(dt) {
  const k = 1 - Math.exp(-4.0 * dt);
  const c = rig.cur, t = rig.tgt;
  c.radius = lerp(c.radius, t.radius, k);
  c.theta = lerp(c.theta, t.theta, k);
  c.phi = lerp(c.phi, t.phi, k);
  c.fov = lerp(c.fov, t.fov, k);
  c.target.lerp(t.target, k);
  applyCamera();
}

function initControls() {
  const el = renderer.domElement;
  const ptrs = new Map();
  let mode = 'orbit';
  let lastDist = 0;
  let lastMid = null;

  const twoDist = () => {
    const a = [...ptrs.values()];
    return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
  };
  const twoMid = () => {
    const a = [...ptrs.values()];
    return { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 };
  };

  const orbit = (dx, dy) => {
    // 本工程的球坐标是 x = r·sinφ·cosθ, z = r·sinφ·sinθ，
    // θ 增大 = 相机绕轴向左移 = 画面内容向右移。
    // 所以水平拖拽要 +dx（跟着手指走）；垂直仍是 -dy（向下拖 → 相机升高）。
    // 不要照抄 OrbitControls 的 -dx，那套的 θ 定义与这里 cos/sin 互换。
    const dt = dx * 0.0052;
    const dp = -dy * 0.0042;
    rig.tgt.theta += dt; rig.cur.theta += dt;
    rig.tgt.phi = clamp(rig.tgt.phi + dp, 0.16, 1.45);
    rig.cur.phi = clamp(rig.cur.phi + dp, 0.16, 1.45);
  };

  const pan = (dx, dy) => {
    if (!camera) return;
    const sc = rig.cur.radius * 0.0015;
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
    rig.tgt.target.addScaledVector(right, -dx * sc).addScaledVector(up, dy * sc);
    rig.tgt.target.x = clamp(rig.tgt.target.x, -190, 190);
    rig.tgt.target.z = clamp(rig.tgt.target.z, -190, 190);
    rig.tgt.target.y = clamp(rig.tgt.target.y, -2, 90);
    rig.cur.target.copy(rig.tgt.target);
  };

  el.addEventListener('contextmenu', (e) => e.preventDefault());

  el.addEventListener('pointerdown', (e) => {
    el.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    mode = (e.button === 2 || e.shiftKey) ? 'pan' : 'orbit';
    if (ptrs.size >= 2) {
      mode = 'pinch';
      lastDist = twoDist();
      lastMid = twoMid();
    }
    stageEl.classList.add('dragging');
    hideHint();
  });

  el.addEventListener('pointermove', (e) => {
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;

    if (ptrs.size >= 2) {
      const d = twoDist();
      const mid = twoMid();
      if (lastDist > 4 && d > 4) {
        const f = clamp(Math.pow(lastDist / d, 0.9), 0.85, 1.18);
        rig.tgt.radius = clamp(rig.tgt.radius * f, 12, 220);
        rig.cur.radius = clamp(rig.cur.radius * f, 12, 220);
      }
      if (lastMid) pan(mid.x - lastMid.x, mid.y - lastMid.y);
      lastDist = d;
      lastMid = mid;
    } else if (mode === 'pan') {
      pan(dx, dy);
    } else {
      orbit(dx, dy);
    }
  });

  const end = (e) => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) { lastDist = 0; lastMid = null; }
    if (ptrs.size === 0) {
      stageEl.classList.remove('dragging');
      mode = 'orbit';
    }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);

  el.addEventListener('wheel', (e) => {
    e.preventDefault();
    const f = Math.exp(e.deltaY * 0.0012);
    rig.tgt.radius = clamp(rig.tgt.radius * f, 12, 220);
  }, { passive: false });

  // 双击归位
  el.addEventListener('dblclick', () => goToPreset(state.camIndex));
}

/* ---------------- 环境音 ---------------- */
const audio = {
  ctx: null, master: null, on: false, windGain: null, waterGain: null, bellTimer: null,
  init() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    const ctx = new AC();
    this.ctx = ctx;
    const master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    this.master = master;

    const len = Math.floor(ctx.sampleRate * 4);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let last = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        last = (last + 0.02 * w) / 1.02;
        d[i] = last * 3.2;
      }
    }

    const src = ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 430;
    const wg = ctx.createGain(); wg.gain.value = 0.55;
    src.connect(lp); lp.connect(wg); wg.connect(master);
    src.start();
    this.windGain = wg;

    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
    const lg = ctx.createGain(); lg.gain.value = 0.22;
    lfo.connect(lg); lg.connect(wg.gain); lfo.start();

    const src2 = ctx.createBufferSource();
    src2.buffer = buf; src2.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1180; bp.Q.value = 0.85;
    const wg2 = ctx.createGain(); wg2.gain.value = 0.26;
    src2.connect(bp); bp.connect(wg2); wg2.connect(master);
    src2.start();
    this.waterGain = wg2;
    return true;
  },
  start() {
    if (!this.ctx) { if (!this.init()) return; }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setValueAtTime(this.master.gain.value, t);
    this.master.gain.linearRampToValueAtTime(0.5, t + 2.2);
    this.on = true;
    this.scheduleBell();
    this.setRain(MOOD_DEFS[state.mood].rain);
  },
  stop() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setValueAtTime(this.master.gain.value, t);
    this.master.gain.linearRampToValueAtTime(0, t + 0.8);
    this.on = false;
    if (this.bellTimer) { clearTimeout(this.bellTimer); this.bellTimer = null; }
  },
  setRain(v) {
    if (!this.waterGain) return;
    const t = this.ctx.currentTime;
    this.waterGain.gain.cancelScheduledValues(t);
    this.waterGain.gain.linearRampToValueAtTime(0.24 + v * 0.55, t + 1.2);
  },
  scheduleBell() {
    if (!this.on) return;
    const ctx = this.ctx;
    const freqs = [523.25, 587.33, 698.46, 783.99, 880.0, 1046.5];
    const f = freqs[(Math.random() * freqs.length) | 0];
    const t0 = ctx.currentTime + 0.15;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.13, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.6);
    g.connect(this.master);
    for (const [mul, amp] of [[1, 1], [2, 0.32], [3.01, 0.14]]) {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = f * mul;
      const og = ctx.createGain(); og.gain.value = amp;
      o.connect(og); og.connect(g);
      o.start(t0); o.stop(t0 + 3.8);
    }
    this.bellTimer = setTimeout(() => this.scheduleBell(), 9000 + Math.random() * 9000);
  },
};

/* ---------------- 界面 ---------------- */
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1900);
}

let hintHidden = false;
function hideHint() {
  if (hintHidden) return;
  hintHidden = true;
  const h = $('#hint');
  if (h) h.classList.add('fade');
}

function setQuality(q) {
  state.quality = q;
  const dpr = window.devicePixelRatio || 1;
  renderer.setPixelRatio(q === 'high' ? Math.min(dpr, 2) : Math.min(dpr, 1.3));
  onResize();

  const sm = q === 'high' ? 2048 : 1024;
  if (sunLight.shadow.mapSize.x !== sm) {
    sunLight.shadow.mapSize.set(sm, sm);
    if (sunLight.shadow.map) {
      sunLight.shadow.map.dispose();
      sunLight.shadow.map = null;
    }
  }
  const refl = q === 'high' ? 768 : 384;
  if (water.reflectRT.width !== refl) water.reflectRT.setSize(refl, refl);

  const btn = document.querySelector('[data-act="quality"]');
  if (btn) btn.classList.toggle('on', q !== 'high');
  toast(q === 'high' ? '画质：高' : '画质：轻量');
}

function saveShot() {
  try {
    renderer.shadowMap.needsUpdate = true;
    water.update(camera, time);
    post.render(time);
    const url = renderer.domElement.toDataURL('image/png');
    const a = document.createElement('a');
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    a.download = `sakura-valley-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.png`;
    a.href = url;
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('画面已保存');
  } catch (e) {
    toast('保存失败：浏览器限制了画布导出');
  }
}

function initUI() {
  document.querySelectorAll('#camPills .pill').forEach((b) => {
    b.addEventListener('click', () => {
      goToPreset(+b.dataset.cam);
      hideHint();
    });
  });
  document.querySelectorAll('#moodPills .pill').forEach((b) => {
    b.addEventListener('click', () => setMood(b.dataset.mood));
  });

  $('#tools').addEventListener('click', (e) => {
    const btn = e.target.closest('.ico');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'reset') {
      goToPreset(state.camIndex);
      toast('视角已重置');
    } else if (act === 'sound') {
      if (audio.on) { audio.stop(); btn.classList.remove('on'); toast('环境音已关闭'); }
      else { audio.start(); btn.classList.add('on'); toast('环境音已开启'); }
    } else if (act === 'quality') {
      setQuality(state.quality === 'high' ? 'lite' : 'high');
    } else if (act === 'shot') {
      saveShot();
    } else if (act === 'hide') {
      setUIHidden(true);
    }
  });

  $('#showUI').addEventListener('click', () => setUIHidden(false));

  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k >= '1' && k <= '4') goToPreset(+k - 1);
    else if (k === 'r') { goToPreset(state.camIndex); toast('视角已重置'); }
    else if (k === 'h') setUIHidden(!state.uiHidden);
    else if (k === 'm') {
      const btn = document.querySelector('[data-act="sound"]');
      if (audio.on) { audio.stop(); btn.classList.remove('on'); toast('环境音已关闭'); }
      else { audio.start(); btn.classList.add('on'); toast('环境音已开启'); }
    } else if (k === 's') saveShot();
    else if (k === 'q') setQuality(state.quality === 'high' ? 'lite' : 'high');
  });

  setTimeout(hideHint, 9000);
}

function setUIHidden(v) {
  state.uiHidden = v;
  document.body.classList.toggle('ui-hidden', v);
}

let resizeTimer = null;
function onResize() {
  if (!renderer || !camera) return;
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + 'px';
  renderer.domElement.style.height = h + 'px';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (post) post.resize();
}

window.addEventListener('resize', () => {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(onResize, 120);
});
window.addEventListener('orientationchange', () => setTimeout(onResize, 300));

/* ---------------- 加载与主循环 ---------------- */
const nextFrame = () => new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));

function setProgress(p, msg) {
  if (lbarFill) lbarFill.style.width = p + '%';
  if (msg && ltext) ltext.textContent = msg;
}

function showError(e) {
  loaderEl.classList.add('done');
  errEl.classList.add('show');
  const code = e && e.code;
  if (code === 'NO_WEBGL') {
    $('#errTitle').textContent = '此设备不支持 WebGL';
    $('#errMsg').innerHTML = '实时 3D 景观需要 WebGL 2 支持。<br/>请更新浏览器，或在设置中开启「硬件加速」后重试。';
  } else if (code === 'CDN') {
    $('#errTitle').textContent = '渲染引擎加载失败';
    $('#errMsg').innerHTML = '无法从 CDN 获取 Three.js。<br/>请检查网络连接后刷新页面。';
  } else {
    $('#errTitle').textContent = '场景构建失败';
    $('#errMsg').innerHTML = '生成 3D 场景时出现错误。<br/>请尝试刷新页面，或换用支持 WebGL 2 的浏览器。';
  }
  const detail = (e && (e.stack || e.message)) || String(e);
  $('#errCode').textContent = String(detail).slice(0, 260);
  console.error(e);
}

const CDNS = [
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://unpkg.com/three@0.160.0/build/three.module.js',
  'https://esm.sh/three@0.160.0',
  'https://cdn.skypack.dev/three@0.160.0',
];

async function loadThree() {
  for (const url of CDNS) {
    try {
      const m = await import(/* @vite-ignore */ url);
      if (m && m.WebGLRenderer) return m;
    } catch (e) {
      console.warn('[sakura] CDN 加载失败:', url);
    }
  }
  const err = new Error('Three.js load failed');
  err.code = 'CDN';
  throw err;
}

let lastT = 0;
function tick(now) {
  if (!running) return;
  requestAnimationFrame(tick);
  const dt = Math.min(0.06, Math.max(0.0005, (now - lastT) / 1000)) || 0.016;
  lastT = now;
  if (document.hidden) return;
  time += dt;

  updateRig(dt);
  updateMood(dt);
  applyLive();

  const shakeOn = !state.reduced;
  petals.update(time, dt);
  floaters.update(time, dt);
  if (shakeOn) {
    fireflies.mat.uniforms.uTime.value = time;
    fireflies.mat.uniforms.uScale.value = state.quality === 'high' ? 1 : 0.8;
    rain.mat.uniforms.uTime.value = time;
    rain.mat.uniforms.uCam.value.copy(camera.position);
    birds.update(time);
    koi.update(time);
  }
  sky.material.uniforms.uTime.value = time;

  renderer.shadowMap.enabled = !DBG.get('noshadow');
  renderer.shadowMap.needsUpdate = true;
  water.update(camera, time);
  post.render(time);
}

async function boot() {
  try {
    const probe = document.createElement('canvas');
    let gl = null;
    try { gl = probe.getContext('webgl2') || probe.getContext('webgl'); } catch (e) { gl = null; }
    if (!gl) {
      const err = new Error('no webgl');
      err.code = 'NO_WEBGL';
      throw err;
    }

    setProgress(5, '正在加载渲染引擎…');
    THREE = await loadThree();
    initColors();

    const isMobile = /Android|iPhone|iPad|iPod|Mobile|Silk/i.test(navigator.userAgent) ||
      (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
      Math.min(window.innerWidth, window.innerHeight) < 640;

    state.quality = isMobile ? 'lite' : 'high';
    state.reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    renderer = new THREE.WebGLRenderer({
      antialias: false,
      alpha: false,
      stencil: false,
      powerPreference: 'high-performance',
      preserveDrawingBuffer: true,
    });
    renderer.setPixelRatio(state.quality === 'high' ? Math.min(window.devicePixelRatio || 1, 2) : Math.min(window.devicePixelRatio || 1, 1.3));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.domElement.style.width = window.innerWidth + 'px';
    renderer.domElement.style.height = window.innerHeight + 'px';
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.shadowMap.autoUpdate = false;
    renderer.toneMapping = THREE.NoToneMapping;
    stageEl.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x54648a, 0.00215);

    camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 1.0, 4200);

    buildLive();

    // 天空
    sky = createSky();
    scene.add(sky);

    // 灯光
    hemiLight = new THREE.HemisphereLight(0x6d84ba, 0x272c3a, 0.66);
    scene.add(hemiLight);

    sunLight = new THREE.DirectionalLight(0xa9c2ff, 1.05);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(state.quality === 'high' ? 2048 : 1024, state.quality === 'high' ? 2048 : 1024);
    const sc = sunLight.shadow.camera;
    sc.left = -165; sc.right = 165; sc.top = 165; sc.bottom = -165;
    sc.near = 20; sc.far = 620;
    sunLight.shadow.bias = -0.0006;
    sunLight.shadow.normalBias = 0.55;
    sunLight.shadow.radius = 2.2;
    sunLight.target.position.set(10, 0, 8);
    scene.add(sunLight);
    scene.add(sunLight.target);

    setProgress(22, '正在塑造山谷地形…');
    await nextFrame();

    setProgress(30, '正在种植樱花与杉林…');
    worldMeshes = buildWorld(state.quality);
    console.log('[sakura] world verts:', worldMeshes.count);

    setProgress(70, '正在注入河水与光…');
    await nextFrame();

    // 暖色点光源
    const warmLights = [
      [34, groundAt(34, 2) + 9, 8, 130, 55],
      [17.5, 8.5, 30, 90, 45],
      [-72, groundAt(-72, -58) + 7, -52, 110, 50],
      [27, groundAt(27, 11) + 5.4, 11, 70, 32],
    ];
    for (const L of warmLights) {
      const pl = new THREE.PointLight(0xffb066, L[3], L[4], 2);
      pl.position.set(L[0], L[1], L[2]);
      pl.userData.base = L[3];
      scene.add(pl);
      lanternLights.push(pl);
    }

    // 水深贴图 + 水面
    const depthTex = makeDepthTexture(worldMeshes.terrain.H, worldMeshes.terrain.N);
    water = createWater(scene, renderer, depthTex);
    if (state.quality !== 'high') water.reflectRT.setSize(384, 384);

    // 粒子
    petals = createFallingPetals(scene, PETAL_SOURCES.length ? PETAL_SOURCES : [{ x: 66, z: 126, y: 6, r: 18, h: 24 }],
      state.quality === 'high' ? 420 : 220);
    floaters = createFloatingPetals(scene, state.quality === 'high' ? 150 : 80);
    fireflies = createFireflies(scene, state.quality === 'high' ? 46 : 26);
    rain = createRain(scene, state.quality === 'high' ? 1500 : 760);
    birds = createBirds(scene, state.quality === 'high' ? 7 : 4);
    koi = createKoi(scene, 5);

    setProgress(88, '正在编译着色器…');
    await nextFrame();

    post = createPost(renderer);
    initRig();
    initControls();
    initUI();

    applyLive();
    renderer.shadowMap.needsUpdate = true;
    water.update(camera, 0);
    post.render(0);

    setProgress(100, '完成');
    setTimeout(() => loaderEl.classList.add('done'), 240);

    window.__dbg = { renderer, scene, camera, water, post, get rig() { return rig; },
      mood(name) { setMood(name); }, preset(i) { goToPreset(i); },
      hide(sel, v) { scene.traverse((o) => { if (o.name === sel) o.visible = v; }); } };

    running = true;
    lastT = performance.now();
    requestAnimationFrame(tick);

    // 减少动态偏好变化
    if (window.matchMedia) {
      const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
      const onChange = () => { state.reduced = mq.matches; };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
    }
  } catch (e) {
    showError(e);
  }
}

boot();
</script>
</body>
